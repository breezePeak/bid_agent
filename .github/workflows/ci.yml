name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: compileall
        run: python -m compileall -q src

      - name: Ruff check
        run: ruff check src tests --quiet

  unit:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests (deterministic)
        env:
          AGENT_SUPERVISOR_ENABLED: "true"
          BID_AGENT_WORKERS_DEFAULT: "2"
          BID_AGENT_WORKERS_MAX: "4"
          BID_AGENT_LLM_CONCURRENCY: "2"
        run: |
          python -m pytest tests -q --tb=line -k "not live_llm"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test & build main frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
