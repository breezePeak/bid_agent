name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: compileall
        run: python -m compileall -q src

      - name: Ruff check
        run: ruff check src tests --quiet || true

      - name: Unit tests (deterministic)
        env:
          AGENT_SUPERVISOR_ENABLED: "true"
          BID_AGENT_WORKERS_DEFAULT: "2"
          BID_AGENT_WORKERS_MAX: "4"
          BID_AGENT_LLM_CONCURRENCY: "2"
        run: |
          python -m pytest tests -q --tb=line \
            --ignore=tests/test_live_llm_config.py \
            -k "not live_llm"

      - name: Agent First acceptance
        env:
          AGENT_SUPERVISOR_ENABLED: "true"
        run: python -m pytest tests/test_agent_first_acceptance.py tests/test_concurrency.py tests/test_supervisor_multistep.py -q --tb=short

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: |
            .pytest_cache/**
            **/pytest*.log
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build main frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install & build 3D frontend
        working-directory: frontend-3d
        run: |
          npm ci
          npm run build
